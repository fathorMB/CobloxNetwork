[package]
name = "coblox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Curve25519 / Edwards25519 curve arithmetic primitive for consensus-critical
# Ed25519 verification conforming to ZIP-215 and Coblox v0 rules.
#
# Provenance, at the granularity that actually reaches the binary. The public
# security audits of curve25519-dalek cover the 2.x, 3.x and 4.x lines; the
# version pinned here is **5.0.0**, a new major with a reworked API surface, and
# **no audit of the 5.x line is cited or known to us**. The same holds for
# sha2 0.11.0. [REVIEW-019] RF-005 required this to be said instead of the
# earlier "vetted primitive crate", which was true of the crate and not of the
# artifact. The choice itself is not retracted — hand-rolled field arithmetic in
# a consensus-critical verifier is the worse risk by a wide margin — but the
# residual is real and is reviewed before the first devnet: either an audit of
# the 5.x line becomes citable, or the pin moves to a covered line, or cargo-vet
# is adopted, which is the structural answer to this class.
#
# What does cover it: Cargo.lock is versioned with checksums, CI builds and tests
# with --locked, the cargo-deny action is pinned by commit SHA, [advisories]
# ignore is empty, and every edge-case behaviour this crate depends on is
# exercised against two published vector tables and an independent oracle.
#
# default-features = false drops `precomputed-tables` (size/speed, not
# correctness) and, deliberately, `legacy_compatibility`: that feature exposes
# `Scalar::from_bits`, which is the "legacy-compatibility mode" the protocol
# document forbids. Nothing here calls it, but cargo feature unification could
# enable it from elsewhere in the graph, so it is named rather than assumed.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["digest"] }
# SHA-256 for protocol preimages, Merkle trees, and identifiers; SHA-512 for
# Ed25519 signature verification hashing (k = SHA-512(R || A || M) mod L).
# See the audit-coverage note above: 0.11.0 is a new major as well.
sha2 = { version = "0.11.0", default-features = false }

[features]
# Not in `default`, and nothing in the workspace enables it: this feature is the
# compilation boundary around `SigningPreimage::from_raw_bytes_non_consensus`,
# the one constructor that builds a signing preimage out of arbitrary bytes and
# therefore without the `domain || 0x00 || chain_id` prefix.
#
# [REVIEW-023] RF-001. Before this section existed the escape hatch was `pub` in
# a `pub mod` behind no gate at all, so `coblox-node`, `coblox-ffi` and the Tauri
# shell could reach it in a **production** build; what stopped a consensus caller
# from taking the shortest conversion that compiles was the name, the comment and
# the review, and none of those can fail a build. The named risk is concrete: a
# preimage built from bytes off the wire verifies a signature bound to neither
# the domain nor the chain, so a vote gathered on a devnet verifies on mainnet.
# That is not an error, it is an acceptance.
#
# The feature is enabled for exactly one consumer: the dev-dependency below,
# which `coblox-core` declares on itself so that its own integration tests --
# which are separate crates and therefore see the crate from the outside, like
# any dependant -- can drive the upstream `ed25519-speccheck` vectors, whose
# messages are raw non-Coblox bytes by construction.
#
# **The limit that remains, stated rather than implied.** This is a guarantee
# about production builds, not an absolute prohibition:
#
#   - `cargo build [--release] -p coblox-node` (and `--workspace`, and the Tauri
#     shell) does not build dev-dependencies, so the feature is off and a call
#     from a dependant fails to compile. This is the case that matters and the
#     one proved in the negative in the SPEC-014 evidence.
#   - `cargo test --workspace` **does** build dev-dependencies, and cargo unifies
#     features across a single invocation, so the feature is on for the whole
#     graph during that command. A call written in the *test* code of another
#     crate would therefore compile. CI still catches it, because `cargo build
#     --locked --workspace` runs before `cargo test`, but only if the call is in
#     code that a plain build compiles.
#   - The residual of the residual -- a call in a dependant's test-only code --
#     is covered textually, not by the compiler, by
#     `sim/tools/non_consensus_containment.py`, which CI runs and which fails if
#     the constructor is named anywhere outside `core/coblox-core/src/registry.rs`
#     and `core/coblox-core/tests/`. That tool is a lint, not a boundary; it is
#     the second half of the answer, not a substitute for the first.
conformance-testing = []

[dev-dependencies]
# `coblox-core` on itself, at the same path, purely to turn on the
# `conformance-testing` feature for its own test targets. This is the whole
# mechanism by which the escape hatch exists for the conformance suite and does
# not exist for anything a user of this library builds.
coblox-core = { path = ".", features = ["conformance-testing"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }
# The two primitive crates the library already depends on, re-declared for the
# test targets. `SPEC-025` needs a *signer*: a consensus engine that produces a
# real chain has to be driven by validators that really sign, and the library
# ships verification only.
#
# It is a dev-dependency and not a dependency, and it is the same two crates
# already in `Cargo.lock`, so no package enters the graph a production build
# links. The signer itself is `tests/common/ed25519_signer.rs`, written from RFC
# 8032 section 5.1.6 and checked against the three Ed25519 vectors of RFC 8032
# section 7.1 before any test uses it; its output is then verified by the
# shipped `ConsensusVerifier`, which is an independent reading of the same
# curve. Adding a signing library instead would have introduced an unaudited
# major version for the sake of code that never reaches production.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["digest"] }
sha2 = { version = "0.11.0", default-features = false }

[lints]
workspace = true
