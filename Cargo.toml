[workspace]
members = [
  "core/coblox-core",
  "core/coblox-node",
  "core/coblox-ffi",
]
resolver = "2"
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/cobloxnetwork/coblox"
# Internal workspace crates only; none of them are published to crates.io.
# This also makes coblox-ffi/coblox-node's path dependency on coblox-core a
# "private path dependency" for cargo-deny's allow-wildcard-paths check.
publish = false

[workspace.lints.rust]
# UniFFI generates `#[unsafe(no_mangle)]` exports in its build output. Source
# crates contain no handwritten unsafe code; generated FFI glue is reviewed by
# the pinned UniFFI dependency and cannot compile under a workspace forbid.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
