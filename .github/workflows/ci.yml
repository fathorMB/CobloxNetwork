name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # branch 1.96.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      # [SPEC-025] GATE-SAFETY-UNDER-ADVERSARY. The always-on sweep runs inside
      # `cargo test` above; this is the large one, and it is `#[ignore]`d there
      # because every message in it costs a real Ed25519 verification and the
      # debug profile makes that about a hundred times slower than the release
      # profile. Running it here, once, on Linux, is what keeps the declared
      # number a guard the pipeline re-runs rather than a figure from a
      # transcript.
      - if: runner.os == 'Linux'
        run: cargo test --release --locked -p coblox-core --test consensus_devnet -- --ignored --nocapture
      # [SPEC-029] GATE-FOUR-PROCESSES e GATE-RESTART-NO-EQUIVOCATION. I due
      # test multiprocesso sono `#[ignore]`d sopra perche' avviano quattro
      # processi validatore ciascuno: eseguiti in parallelo fra loro, e in
      # debug, non finivano entro le proprie scadenze su nessuna delle due
      # piattaforme. Qui girano una volta, in serie e in release. Le scadenze
      # sono quelle originali: e' l'esecuzione a essere cambiata, non
      # l'asserzione.
      - if: runner.os == 'Linux'
        run: cargo test --release --locked -p coblox-node --test devnet_multiprocess -- --ignored --nocapture --test-threads=1
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  protocol-docs:
    # The guards over docs/protocol/ that [ADR-012] requires to be versioned.
    # They were versioned but never executed by anything except a person
    # remembering to, which is the failure mode that ADR exists to close: a
    # guard nobody runs is a guard nobody trusts. These three exit non-zero on
    # a finding and need no toolchain beyond the standard library.
    name: Protocol document guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-python step: the runner image ships a python3 newer than the
      # 3.11 these tools need (they use `tomllib`, added in 3.11), and pinning
      # another action by digest buys nothing here.
      - name: Interpreter version
        run: python3 --version
      - name: Published-artifact inventory
        run: python3 sim/tools/published_artifacts.py
      - name: The inventory proved in the negative, ten defect classes
        run: python3 sim/tools/published_artifacts_negative.py
      - name: Registry hashes recomputed from the written bytes
        run: python3 sim/tools/protocol_hashes.py
      - name: Reward and election rule checks
        run: python3 sim/tools/reward_rules.py
      # The second road of `GATE-TWO-DERIVATIONS`. `chain_id` is derived from
      # `genesis_block_id`, whose preimage carries `chain_id_32`, so the
      # derivation is circular at genesis and the rule that breaks it cannot be
      # checked by one implementation: one implementation is internally
      # consistent by construction, which is why [DEBT-012] stayed invisible
      # until [SPEC-010]. This tool was written from the document and shares no
      # code with `coblox-core`; `tests/genesis_derivation.rs` is the other
      # road. It also watches each clause of the rule fail on every run rather
      # than once in a transcript.
      - name: Genesis chain-ID derivation, second road
        run: python3 sim/tools/genesis_chain_id.py
      # An independent re-derivation of the published Ed25519 outcome table,
      # sharing no code with core/coblox-core. The conformance suite compares
      # the document with the implementation; this compares the document with a
      # second, unrelated reading of the same rule, which is the check that
      # would have caught the vector-8 defect of [REVIEW-018].
      - name: Ed25519 speccheck table, independent oracle
        run: python3 sim/tools/ed25519_speccheck_oracle.py --explain
      # The Coblox extension vectors are constructed, not collected, so the
      # construction has to be reproducible by anyone: this fails if the
      # committed fixture and the generator disagree by a single byte.
      - name: Ed25519 Coblox extension vectors reproduce
        run: python3 sim/tools/ed25519_coblox_extension_vectors.py
      # [REVIEW-023] RF-001. The first gate in this pipeline over the source
      # tree rather than over docs/protocol/. The primary containment of the
      # non-consensus signing-preimage constructor is a compilation boundary --
      # the non-default `conformance-testing` feature -- and `cargo build
      # --workspace` in the `rust` job is what fails when a dependant calls it
      # from code a plain build compiles. This is the second half: cargo
      # unifies features across a single invocation, so under `cargo test
      # --workspace` the feature is on for the whole graph and a call in
      # another crate's *test* code would still compile. It also catches the
      # containment being undone by one line in a manifest, which no build
      # would notice. It is a lint, not a boundary, and says so.
      - name: The non-consensus escape hatch stays contained
        run: python3 sim/tools/non_consensus_containment.py
      - name: That containment proved in the negative, three defect classes
        run: python3 sim/tools/non_consensus_containment.py --negative
      # [SPEC-023] and [DEBT-036]: closure of ConsensusParametersBody schema
      # against the union of ledger.md constraint block and README.md DRAFT list.
      - name: ConsensusParametersBody schema closure
        run: python3 sim/tools/consensus_parameters_closure.py
      - name: ConsensusParametersBody closure proved in the negative
        run: python3 sim/tools/consensus_parameters_closure.py --negative
      # [SPEC-025] GATE-NO-IO. The primary demonstration is the engine's own
      # interface -- `step_event` takes an `Event` and returns `Vec<Action>`, so
      # there is no seam to route a socket through. This is the second half, for
      # the reason [REVIEW-022] gave about `pub(crate)`: a guarantee held by a
      # name is one that a single line undoes without failing any build.
      - name: The consensus engine has no I/O
        run: python3 sim/tools/consensus_no_io.py
      - name: That lint proved in the negative, three defect classes
        run: python3 sim/tools/consensus_no_io.py --negative

  android:
    name: Android arm64 + Kotlin bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # branch 1.96.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The runner image preinstalls an older NDK and exports
          # ANDROID_NDK_ROOT for it. cargo-ndk reads both variables and warns
          # on a mismatch; pin ROOT to the same NDK so the toolchain actually
          # used is unambiguous rather than dependent on lookup precedence.
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android library and test generated Kotlin binding
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coblox-ffi-android-arm64
          path: apps/android/core/src/main/jniLibs/arm64-v8a/libcoblox_ffi.so
          if-no-files-found: error

  desktop:
    name: Tauri desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # branch 1.96.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # src-tauri is excluded from the root Cargo workspace (see the root
      # Cargo.toml `exclude`), so the workspace-wide rust job never lints it
      # and the workspace-wide `cargo deny` never sees its dependency graph.
      # Run its own fmt/clippy/deny gates once, on Linux, to keep it covered.
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # DEBT-009: without this step the desktop shell's dependency graph -- the
      # largest in the project, since it pulls in Tauri, WebKitGTK and the GTK
      # stack -- had no advisory or licence gate at all, and the pipeline
      # reported green over dependencies it had never checked. cargo-deny picks
      # up apps/desktop/src-tauri/deny.toml automatically, next to the manifest;
      # that file is deliberately separate from the root one and explains why.
      - if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml
      - run: npm ci
      - run: npm run build
      # clippy has to run after `npm run build`: `tauri::generate_context!`
      # resolves `frontendDist` (apps/desktop/dist) at macro-expansion time and
      # panics when that directory is missing, so src-tauri cannot be compiled
      # -- and therefore cannot be linted -- before the frontend bundle exists.
      - if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: npm run tauri -- build --no-bundle
      - name: Verify core version command is compiled into the desktop shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features core_version -- --nocapture
