pattern = "would be the overstated safety claim this document refuses to make\\."
count = 1
claims = ["Writing \"cannot be faked without spending real resources\" would claim more than the rules deliver."]
why = "The guide quotes the retracted sentence and says why it is not used. A retraction that is deleted is a rehabilitation, and this guide would then be free to reprint the stronger claim."

[[probe]]
id = "guide-transport-key-not-on-the-ledger"
site = "identity.md"
pattern = "\\*\\*never published on the ledger\\*\\*"
count = 1
claims = ["Your network address is never written into the shared register"]
why = "The one privacy reassurance on this page, so the one most in need of an anchor. It holds only while the transport key and its binding stay off the ledger."

[[probe]]
id = "guide-attestation-may-not-name-the-identity-key"
site = "identity.md"
pattern = "as its `transport_public_key` MUST be rejected"
count = 1
claims = ["the key your device uses to make connections is deliberately a different key from the one that identifies you, so that nobody can work out one from the other by reading the register alone"]
why = "The separation is only worth what its enforcement is worth. This is the receiver-side rejection that makes it a validity rule rather than a recommendation a node could ignore about itself."

[[probe]]
id = "guide-envelopes-carry-your-node-id-in-clear"
site = "wire.md"
pattern = "in the signed cleartext"
count = 1
claims = ["every node you actually talk to sees the address you are connecting from, and your messages carry your node identifier in the clear"]
why = "The correction the guide puts immediately after the reassurance. Messages are attributed to the node identifier in the clear, so taking part links the pseudonym to an address for every peer, whatever the ledger does or does not publish."

[[probe]]
id = "guide-revocation-transfers-nothing"
site = "ledger.md"
pattern = "receives no balance, nonce, or privileges from the old"
count = 1
claims = ["a replacement identity inherits nothing: no balance, no history, no standing"]
why = "A reader might reasonably assume a replacement key carries the old one's balance across. It does not, and the guide says so in the same paragraph as the revocation power."

[[probe]]
id = "guide-validator-misconduct-is-a-revocation-reason"
site = "ledger.md"
pattern = "\"reason\":\"key_compromise\"\\|\"validator_misconduct\"\\|\"operator_request\""
count = 1
claims = ["a validator that misbehaves can have its identity revoked by the others and loses its seat"]
why = "The enumerated reasons are the whole of what revocation is for. The guide names two of the three to a reader and would be inventing a power if the enumeration changed."

[[probe]]
id = "guide-no-partially-applied-blocks"
site = "ledger.md"
pattern = "execution invalidates the entire proposed block"
count = 1
claims = ["A block that contains a single entry which does not execute is rejected whole: there are no half-applied blocks."]
why = "The all-or-nothing rule is what lets the guide tell a reader that a bad entry cannot leave a partial effect behind."

[[probe]]
id = "guide-light-client-validates-its-checkpoint"
site = "ledger.md"
pattern = "\\*\\*Validate the external checkpoint\\.\\*\\*"
count = 1
claims = ["It holds a recent checkpoint signed by a key it already trusts"]
why = "The guide's account of what a phone checks starts here. If the checkpoint stopped being validated the rest of the description would still read correctly and be worthless."

[[probe]]
id = "guide-light-client-fails-closed"
site = "ledger.md"
pattern = "unknown-key checkpoints fail closed"
count = 1
claims = ["It fails closed rather than open", "signed by an unknown key"]
why = "The distinction a reader cannot check for themselves, and the one that decides whether a stale checkpoint is a refusal or a silent downgrade. It holds the disposition and the fourth of the four conditions the page names - the unknown key - and no more than that: REVIEW-031 left the question of the other three open, and the answer was three probes toward the three rules that hold them rather than a wider pattern here. A single rule made to look as though it anchored four conditions is the defect that review came to census."

# --- the other three conditions of the same sentence -------------------------
#
# REVIEW-031 recorded that `guide-light-client-fails-closed` pins six words and
# leaves four conditions uncovered: a checkpoint missing, too old, from the wrong
# chain, or signed by an unknown key. Extending its pattern was the tempting
# repair and is the wrong one - it would make one rule appear to hold four
# separate requirements, each of which can be relaxed on its own. Step 1 of the
# light-client algorithm states them as three distinct requirements plus the
# clause that closes the fallback, so they are pinned as three distinct probes.

[[probe]]
id = "guide-light-client-checkpoint-must-not-be-missing"
site = "ledger.md"
pattern = 'Genesis and the following steps alone are not\s+sufficient after that window'
count = 1
claims = ["a checkpoint that is missing"]
why = "The condition without which the other three are decorative. A client that could fall back to genesis and the remaining steps would treat an absent checkpoint as an inconvenience rather than a stop, and every other check in this list would still pass on the way down. This is the clause that refuses the fallback."

[[probe]]
id = "guide-light-client-checkpoint-must-not-be-stale"
site = "ledger.md"
pattern = 'to be at most the `max_weak_subjectivity_age_ms` carried\s+\*\*in the checkpoint itself\*\*'
count = 1
claims = ["too old"]
why = "The age bound, and the fact that the bound travels **in the checkpoint** rather than being read from the chain the client has not yet trusted. Both halves are pinned together because a bound the client fetched from the chain it is about to validate would be the same defect as a cadence band learned from a peer."

[[probe]]
id = "guide-light-client-checkpoint-must-match-the-chain"
site = "ledger.md"
pattern = 'already holds, require its\s+`chain_id` to equal the configured chain ID'
count = 1
claims = ["from the wrong chain"]
why = "The condition a reader is least likely to imagine, because a valid signature over a valid checkpoint of ANOTHER chain is a genuine object and not a forgery. The pattern is anchored on the preceding clause because the same requirement is stated again for the cadence band in step 4b, and a pattern matching both would keep passing if step 1 lost it."

[[probe]]
id = "guide-light-client-refuses-to-regress"
site = "ledger.md"
pattern = "\\*\\*Enforce non-regression\\.\\*\\*"
count = 1
claims = ["it will not accept a lower height than the highest it has already trusted, nor a different block at a height it has already seen"]
why = "Non-regression is what stops a device being walked backwards onto a different history. The guide describes both halves because the rule states both."

# --- probes added by REVIEW-031 remediation ---------------------------------
#
# REVIEW-031 found that in three of the page's strongest sentences the `claims`
# substring stopped BEFORE the clause that carried the risk, and defended the
# modest half beside it. It could not be otherwise: a clause that exceeds what
# the rules hold is not anchorable PRECISELY BECAUSE it exceeds them, so the
# hand that chose the substring chose the half that was anchorable. The remedy
# is therefore in two parts and neither works alone — the page was corrected so
# that the exceeding clause says what the rules hold, and these probes pin the
# corrected clause to the rule that now holds it.

[[probe]]
id = "guide-period-is-counted-in-blocks"
site = "README.md"
pattern = 'no v0 validity rule imposes the cadence'
count = 1
claims = ["A period here is a fixed number of blocks, not a stretch of time."]
why = "REVIEW-031 RF-002: the page used `period` in four distinct senses, every one of them counted in blocks, and never said so — so a reader took the emission cap for a cap per unit of time. This is the rule that says the cadence is declared and not enforced, and therefore the rule that makes the distinction load-bearing rather than pedantic."

[[probe]]
id = "guide-cadence-is-measured-not-imposed"
site = "README.md"
pattern = 'the active\svalidator set determines the real-time duration of its own epochs'
count = 1
claims = ["how fast the chain really runs is something the network measures afterwards rather than something its rules impose"]
why = "REVIEW-031 RF-002: the consequence, stated in the specification in the same breath as the constant it qualifies. If this sentence weakens, the guide's whole paragraph on what a period is stops being true."

[[probe]]
id = "guide-fast-side-admits-a-doubling"
site = "README.md"
pattern = 'real issuance rate up to \*\*twice\*\* the intended one and refuses beyond it'
count = 1
claims = ["The band the network is measured against admits a chain running up to twice as fast as intended before it objects"]
why = "REVIEW-031 RF-002: the size of the residue, which is the part a reader cannot infer. Saying the cadence is measured without saying that the measurement tolerates a doubling would replace one reassurance with another."

[[probe]]
id = "guide-incumbency-can-be-stretched-by-a-third"
site = "SECURITY.md"
pattern = 'It requires only a \*\*blocking third\*\*, which\ssimply withholds the quorum'
count = 1
claims = ["a third of the validators can withhold the quorum a block needs, slow the chain down, and so stretch how long their own terms last in real time without breaking a single rule."]
why = "REVIEW-031 RF-001: the page promised rotation `whatever anybody intends`, which is true in blocks and false in real time. The price of making it false is a blocking third — less than anything else in this protocol costs — and this is the sentence that names that price."

[[probe]]
id = "guide-control-of-the-set-is-four-ninths"
site = "ledger.md"
pattern = 'requires \*\*about four ninths\*\*'
count = 1
claims = ["holds the quorum of the smaller set from about four ninths of the original one, and never has to break a rule to get there."]
why = "REVIEW-031 RF-003, and the point DEBT-023 named in advance. The page gave the reader two thirds and only two thirds, which is the intuition this document records having refuted three times. The paragraph pinned here is the one that states the corrected threshold and says why the two-thirds argument does not reach it."

[[probe]]
id = "guide-churn-cap-is-applied-after-the-draw"
site = "ledger.md"
pattern = '`validator_churn_cap_seats` however favourable the seed is'
count = 1
claims = ["how many seats can change hands at one boundary is limited by a cap applied after the draw"]
why = "REVIEW-031 RF-004: the page had attributed succession safety to randomness nobody can choose, which is the property this document explicitly declines to assume. This is the mechanism that actually holds it, and it holds it however biased the seed is."

[[probe]]
id = "guide-compute-challenge-input-is-chosen-by-the-issuer"
site = "wire.md"
pattern = '"input": base64url\(bytes\)'
count = 1
claims = ["For a computation challenge the asker supplies the code and the input itself, so it does choose what you are asked to compute"]
why = "REVIEW-031 RF-005: the page said the asker does not choose the question either, which holds for the pairing and the randomness and fails for compute, where the issuer supplies `module_hash` and `input` verbatim. Pinning the field is what stops the concession from being quietly dropped if the shape changes."

[[probe]]
id = "guide-light-client-measures-the-cadence"
site = "ledger.md"
pattern = 'MUST fail closed when the chain is faster than the band'
count = 1
claims = ["Too fast, and the phone stops: nothing honest makes blocks appear."]
why = "REVIEW-031 RF-008, the only finding that added instead of removing. This is the one defence an ordinary device can exercise alone, and the page stopped one step before it. The asymmetry is in the rule and is kept in the page."

[[probe]]
id = "guide-cadence-band-is-not-learned-from-a-peer"
site = "ledger.md"
pattern = 'MUST NOT be learned from a peer, a header, or a chain'
count = 1
claims = ["may never be learned from a peer"]
why = "REVIEW-031 RF-008: without this clause the measurement is theatre, because the party being measured would supply the ruler. It is a separate probe from the fail-closed rule because it is a separate requirement that could be relaxed on its own."

[[probe]]
id = "guide-revoked-key-cannot-re-enrol"
site = "identity.md"
pattern = 'neither `node_id` nor public key is already enrolled or revoked'
count = 1
claims = ["and from enrolling again"]
why = "REVIEW-031 RF-006: the page said revocation removes a key from `participation`, which is wider than the rules and wider in exactly the direction DEBT-022 is open in. This is the half of the narrowed sentence that the enrollment rule holds."

[[probe]]
id = "guide-revocation-forces-a-set-transition"
site = "identity.md"
pattern = 'It therefore \*\*forces\*\* a set transition'
count = 1
claims = ["revocation removes a key from taking part in consensus"]
why = "REVIEW-031 RF-006: the other half. Without the forced transition a revoked validator keeps its voting power until some later transition no rule requires, so this is the rule that makes the narrowed sentence true rather than merely smaller."

# --- probes added by the [DEBT-032] ageing pass, 2026-08-26 ------------------
#
# The first time anybody looked in this direction on purpose rather than by
# accident. [SPEC-019] and [SPEC-020] landed after [REVIEW-031] and moved rules
# the page describes; every probe stayed green throughout, because a probe sees
# the page drift away from itself and not away from the protocol, which is
# exactly what [DEBT-032] says. Two passages were found overstating what the
# rules now hold. The page was corrected and the corrected clauses are pinned
# here, one probe per rule.

[[probe]]
id = "guide-revocation-bites-at-a-written-height"
site = "ledger.md"
pattern = 'no `revoke_identity` in that chain names `node_id` at a height at most `h` —\s+the block at `h` included'
count = 1
claims = ["The quorum that revokes writes into the revocation the height from which it bites"]
why = "[ADR-017] defined `enrolled, unrevoked` on the transaction authorization path against inclusion height. Repointed together with `unrevoked-anchored-to-the-including-height` on [REVIEW-042] RF-002: the guide claim it holds honest is about which height a revocation bites at, and the clause it reads had two readings on exactly the boundary row."

[[probe]]
id = "guide-revoked-key-still-authorises-until-then"
site = "ledger.md"
pattern = 'on the \*\*validator set path\*\*, `effective_height` continues to govern validator set'
count = 1
claims = ["until that height the revoked key still authorises everything it authorised before"]
why = "[ADR-017] clarifies that delayed effective_height applies to validator set succession rather than spending."

[[probe]]
id = "guide-revocation-height-has-no-ceiling"
site = "ledger.md"
pattern = '`effective_height` MUST lie within\s+the reason-dependent band'
count = 1
claims = ["No rule caps how far ahead that height may be set"]
why = "[ADR-017] bounds effective_height with reason-dependent ceilings."

[[probe]]
id = "guide-revocation-protection-is-chosen-by-the-revoker"
site = "ledger.md"
pattern = 'This completely eliminates the vulnerability window where a compromised key could drain a'
count = 1
claims = ["how much a revocation protects is chosen by the quorum that revokes"]
why = "[ADR-017] / SPEC-022: under inclusion-height spending semantics, spending protection is immediate upon inclusion."

[[probe]]
id = "guide-cadence-clock-is-signed-by-a-release-key"
site = "ledger.md"
pattern = '`issued_at_ms` is signed by a release key that\s+belongs to no validator'
count = 1
claims = ["signed by a release key that belongs to no validator"]
why = "[SPEC-020] measured what the holder of that key can do to this very reading: inflating `issued_at_ms` by a delta shrinks the denominator until the client fails closed. The page had called the cadence check a defence exercised `without trusting anybody to tell you the truth`, which was one word too strong the moment somebody wrote down whose signature the clock carries. The corrected clause names the key, and this rule is where the naming comes from."

# --- SECURITY.md, the claim document ----------------------------------------
#
# Published by GitHub from the repository's Security tab, which makes it the
# first artifact an outside researcher reads. It was outside this inventory
# until [SPEC-016], and the omission is the reason the sweep could pass green
# while its cadence paragraph named one of two directions: the guard had
# measured the wrong set.
#
# It carries claims and not artifacts — no digest, no domain string, no tag
# byte, no fixture identifier — so it is swept for C10 probes only. C11 keeps
# that decision honest by failing the day it grows one of those.

[[probe]]
id = "security-sybil-not-cryptographic"
site = "SECURITY.md"
pattern = '\*\*The network is not cryptographically Sybil-resistant\.\*\*'
count = 1
why = "The load-bearing claim of the whole file, and the one [ADR-007] exists to keep honest. It is robust against forgery and does not distinguish N emulated nodes from N devices; a researcher who does not read this sentence will report the gap as a vulnerability, and a maintainer who deletes it is claiming a resistance the protocol does not have."

[[probe]]
id = "security-sybil-is-economic-not-cryptographic"
site = "SECURITY.md"
pattern = 'Sybil\s+resistance is treated as an economic property'
count = 1
why = "The half of the claim that says what replaces the cryptographic guarantee. Without it the sentence above reads as an unmitigated hole rather than as a stated design position."

[[probe]]
id = "security-quorum-four-ninths"
site = "SECURITY.md"
pattern = 'reach a quorum from roughly \*\*four\s+ninths\*\* of the set'
count = 1
why = "[ADR-010] and [REVIEW-014]: the relational rule prevents a coalition below two thirds from *owning* the set, not from obtaining its *quorum*. This is the corrected figure, and the third occurrence of family 2 in recurring-defects.md is the same claim being reclaimed at two thirds after a rule change. If it softens back, that occurrence has repeated."

[[probe]]
id = "security-owning-is-not-controlling"
site = "SECURITY.md"
pattern = 'prevents a coalition below two thirds from\s+\*owning\* the set, not from obtaining its \*quorum\*'
count = 1
why = "The distinction the four-ninths figure rests on. Stating the figure without the distinction leaves a reader unable to check it."

[[probe]]
id = "security-cadence-is-measured-not-enforced"
site = "SECURITY.md"
pattern = '\*\*How fast the chain runs is measured, not enforced\.\*\*'
count = 1
why = "[SPEC-016] and [ADR-013] part 3: the measurement is not a prohibition, and the heading is where a reader decides which of the two this project claims. 'Enforced' would be the family 2 defect written into the document an outside researcher reads first."

[[probe]]
id = "security-cadence-both-directions"
site = "SECURITY.md"
pattern = '\*\*Compressing\*\* multiplies real issuance'
count = 1
why = "The direction the paragraph named for months and the earlier text did not. It became a harm only when the reward-epoch index was derived from height in [SPEC-016]; a limitation stated in one direction reads as complete."

[[probe]]
id = "security-cadence-not-prevented"
site = "SECURITY.md"
pattern = 'manoeuvre is not prevented\.'
count = 1
why = "The sentence that stops the paragraph from promising more than the code contains, which is the risk [SPEC-016] names as dominant. A measurement described without it is read as enforcement."

[[claim_count]]
id = "threat-model-scenarios"
site = "SECURITY.md"
pattern = '`\.lmbrain/knowledge/threat-model\.md`: (\d+) scenarios'
source = ".lmbrain/knowledge/threat-model.md"
token = '\bTM-\d+\b'
why = "The count was transcribed once and drifted: the file said 36 while the threat model carried 39. A number copied by hand into a published document is the shape of defect [SPEC-012] closed by extracting the table instead of transcribing it, so this one is recomputed from the source rather than pinned."

[[claim_count]]
id = "threat-model-security-requirements"
site = "SECURITY.md"
pattern = 'scenarios, (\d+) numbered security'
source = ".lmbrain/knowledge/threat-model.md"
token = '\bSEC-REQ-\d+\b'
why = "Same defect, same file, same sentence: it said 24 while the threat model carried 26."

[[claim_count]]
id = "threat-model-attack-tests"
site = "SECURITY.md"
pattern = 'and (\d+) attack tests'
source = ".lmbrain/knowledge/threat-model.md"
token = '\bAT-\d+\b'
why = "The third number in the same sentence. It happened to be right, which is why it is checked: a claim that is correct today and unproven is one edit away from being the next stale one."

# The criterion these were written against, after [REVIEW-027] RF-004 found the
# first seven protecting one half of a two-sided claim:
#
#   **one probe per half of every two-sided statement.**
#
# A limitation stated in one direction reads as complete, so the half that is
# unpinned is the half a future edit removes without anything failing. The
# original seven pinned the direction the remediation *added* and left unpinned
# the direction that was already there — the same asymmetry of attention that
# [REVIEW-025] RF-001 censured a level above, committed inside its own fix.

[[probe]]
id = "security-cadence-stretching"
site = "SECURITY.md"
pattern = '\*\*Stretching\*\* lengthens, in real time'
count = 1
why = "The slow half of the two-sided cadence claim. Deleting it returns the paragraph to naming one direction, which is the defect [REVIEW-025] RF-001 raised; for one revision it was unpinned while its twin was pinned, and the gate stayed green on the deletion."

[[probe]]
id = "security-cadence-stretching-set-path-only"
site = "SECURITY.md"
pattern = 'the\s+delay before a revocation takes effect \*\*on the validator set\*\*'
count = 1
why = "[REVIEW-042] RF-005. The sentence named 'the effective delay of a revocation' as one quantity, which [ADR-017] made two: `effective_height` governs the set path, and the spending path bites at inclusion height. This probe pins the half that says *which* delay stretching lengthens. The opening of the sentence was already pinned by the probe above, and only the opening was, so the gate was green on the list that had become ambiguous."

[[probe]]
id = "security-cadence-does-not-stretch-the-spending-path"
site = "SECURITY.md"
pattern = 'a revocation bites at the height of the block\s+that includes it, so its delay there is zero blocks'
count = 1
why = "[REVIEW-042] RF-005, the other half. Naming which delay stretches without naming which one does not leaves a reader to infer that both do, which is the reading the sentence had before [ADR-017] and which overstates the harm of a slow chain."

[[probe]]
id = "security-cadence-two-thresholds"
site = "SECURITY.md"
pattern = 'requires only a \*\*blocking third\*\*'
count = 1
why = "[REVIEW-027] RF-002: stretching costs a blocking third, compressing costs a quorum, and the file said 'either direction' as if they were the same price. This is the sentence a researcher uses to price the attack, and it is the fact that explains why the protocol fails closed on one side and only reports on the other."

[[probe]]
id = "security-cadence-quorum-side"
site = "SECURITY.md"
pattern = 'compressing requires a \*\*quorum\*\*'
count = 1
why = "The other half of the same two-sided statement. The two thresholds are only informative together: naming the cheap one alone understates the fast attack, naming the expensive one alone understates the slow one."

[[probe]]
