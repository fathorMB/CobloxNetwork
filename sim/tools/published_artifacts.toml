# --- named conformance fixtures --------------------------------------------

[[fixture]]
id = "ADM-0"
site = "README.md"
covers = "the admission tag"

[[fixture]]
id = "ADM-1"
site = "identity.md"
covers = "the admission-shield burst behaviour fixture (behavioural, not a digest)"

[[fixture]]
id = "APP-0"
site = "README.md"
covers = "the suspended app account, its account_key and its app_leaf"

[[fixture]]
id = "AUTH-0"
site = "ledger.md"
covers = "the enrolled, unrevoked qualification on the spending path, where a revocation bites at the height of the block that includes it, and the two clause boundaries (behavioural, not a digest). The description used to name 'the interval in which a revocation is finalized but not yet effective', which is the window [ADR-017] abolished on this path; the interval survives on the validator set path only, and the fixture stopped being about it. [REVIEW-042] RF-005."

[[fixture]]
id = "CMT-0"
site = "README.md"
covers = "the challenge issuer commitment"

[[fixture]]
id = "DHT-0"
site = "README.md"
covers = "the Kademlia namespace key of the GEN-0 genesis block ID"

[[fixture]]
id = "ELEC-0"
site = "README.md"
covers = "the epoch-3 election entropy, seed and ticket"

[[fixture]]
id = "ER-0"
site = "README.md"
covers = "the enrollment request of the registry"

[[fixture]]
id = "GEN-0"
site = "README.md"
covers = "the genesis material of the genesis-fixture network: the genesis consensus_parameters document, the height-0 header, the genesis block ID and the chain ID derived from it under the placeholder rule"

[[fixture]]
id = "GEN-1"
site = "README.md"
covers = "GEN-0 on a network name of a different byte length: the case without which no derivation fixture exercises u32be(len(network_id_utf8)), and without which the two roads of GATE-TWO-DERIVATIONS agree on one genesis only"

[[fixture]]
id = "HASH-0"
site = "README.md"
covers = "the all-zero chain_id and the 00 01 02 byte string shared by the registry rows"

[[fixture]]
id = "ORDER-1"
site = "ledger.md"
covers = "the state transition ordering fixture (behavioural, not a digest)"

[[fixture]]
id = "PD-0"
site = "README.md"
covers = "the four governed protocol documents of the registry"

[[fixture]]
id = "REQ-0"
site = "README.md"
covers = "the unsigned challenge request"

[[fixture]]
id = "RESP-0"
site = "README.md"
covers = "the unsigned challenge response"

[[fixture]]
id = "REVL-0"
site = "README.md"
covers = "the single revocation leaf, which is also the single-entry root"

[[fixture]]
id = "RND-0"
site = "README.md"
covers = "the challenge randomness derived from CMT-0"

[[fixture]]
id = "SMT-1"
site = "ledger.md"
covers = "the negative sparse-Merkle proof with an explicit default sibling"

[[fixture]]
id = "TKA-0"
site = "identity.md"
covers = "the canonical transport key attestation, whose transport key is required to differ from the identity fixture key"

[[fixture]]
id = "WSC-0"
site = "README.md"
covers = "the unsigned weak subjectivity checkpoint"

