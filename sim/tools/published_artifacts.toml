# --- equalities an inline example must satisfy -----------------------------

[[example_invariant]]
id = "challenge-evidence-request-hash"
site = "ledger.md"
selector = "\"kind\":\"challenge_evidence\""
equal_fields = ["body.challenge_id", "body.request_hash"]
rule = "README.md#hash-preimage-registry: `challenge_id` MUST equal `request_hash`"

# --- hand-pinned normative passages ----------------------------------------

[[probe]]
id = "block-interval-genesis-constant"
site = "README.md"
pattern = "\\| `block_interval_seconds` \\| `5` \\| no — genesis only \\(\\[ADR-013\\]\\) \\|"
count = 1
why = "The genesis constant of [ADR-013] must stay in the documents as a constant and not as a governed parameter."

[[probe]]
id = "block-interval-not-enforced"
site = "README.md"
pattern = "\\*\\*`block_interval_seconds = 5` is declared, not enforced\\.\\*\\*"
count = 1
why = "[ADR-013] part 3 is a renunciation, and a declared cadence reads as an enforced one unless the difference is written."

[[probe]]
id = "block-interval-debt-link"
site = "README.md"
pattern = "\\[DEBT-013\\]"
count = 1
why = "The unenforced cadence must stay linked to the debt that owns it; SPEC-010 was not permitted to close it."

[[probe]]
id = "block-interval-in-ledger"
site = "ledger.md"
pattern = "\\*\\*The target block interval is 5 seconds, and v0 does not enforce it\\.\\*\\*"
count = 1
why = "The block-format section is where an implementer looks for the timestamp rules and must find the non-imposition there."

[[probe]]
id = "lifecycle-encoding-table"
site = "ledger.md"
pattern = "\\| `suspended` \\| `0x03` \\|"
count = 1
why = "The lifecycle_u8 encoding is normative because it enters a preimage; DEBT-012 exists because it was missing."

[[probe]]
id = "lifecycle-zero-reserved"
site = "ledger.md"
pattern = "\\*\\*Every other value, `0x00` included, is invalid\\.\\*\\*"
count = 1
why = "An unknown lifecycle value must be rejected and never defaulted; a default is how the divergence returns."

[[probe]]
id = "argon2id-band-declared"
site = "README.md"
pattern = "`iterations = 1` with `196608 <= memory_kib < 2097152`"
count = 1
why = "RF-109: the admitted band must stay named, because the sentence that omitted it claimed more than the rules impose."

[[probe]]
id = "argon2id-superlative-retracted"
site = "README.md"
pattern = "That is \\*\\*not\\*\\* the same as \\\"everything weaker than either recommendation is"
count = 1
why = "RF-109: the retraction must stay. A retraction that is deleted is a rehabilitation, and .lmbrain/knowledge/recurring-defects.md records what a rehabilitation cost this project."

[[probe]]
id = "admission-nonce-volume-rule"
site = "identity.md"
pattern = "\\*\\*issuance is counted against the step-1 per-source rate limit\\*\\*"
count = 1
why = "RF-110: without counting issuance, Part 1 of the admission shield costs an attacker a round trip and not an address."

[[probe]]
id = "admission-nonce-cap-declared"
site = "identity.md"
pattern = "every `k` concurrent slots"
count = 1
why = "RF-110: the consequence must be stated in terms of the declared cap, not as one address per slot."

[[probe]]
id = "inline-examples-not-oracles"
site = "README.md"
pattern = "\\*\\*The fixture table above is the only oracle in these documents\\.\\*\\*"
count = 1
why = "Sixteen of the thirty-seven published digests are placeholders; without this statement a reader cannot tell which."

[[probe]]
id = "ed25519-rule1-clause-a"
site = "README.md"
pattern = "a `y` whose masked value is `>= 2\\^255-19` is \\*\\*not\\*\\* rejected"
count = 1
why = "REVIEW-019 RF-002: rule 1 named one decoding departure from RFC 8032 and left the other implicit. Half a normative rule is the shape of defect ADR-012 exists for, and this half is the one no upstream vector exercises."

[[probe]]
id = "ed25519-rule1-clause-b"
site = "README.md"
pattern = "`x = 0` with the sign bit set to 1 is \\*\\*not\\*\\* rejected"
count = 1
why = "REVIEW-019 RF-002: this is the clause upstream vectors 8-11 actually exercise, and the one the rule used to be silent about while its prose mislabelled it as a non-canonical y."

[[probe]]
id = "ed25519-extension-table-required"
site = "README.md"
pattern = "MUST pass \\*\\*both\\*\\* tables before it can participate in a Coblox network"
count = 1
why = "REVIEW-019 RF-001: an implementation that passes only the upstream twelve has demonstrated nothing about clause 1a, so conformance has to name both tables or the second one is decoration."

[[probe]]
id = "transport-key-distinct-from-identity"
site = "identity.md"
pattern = 'the transport public key MUST NOT equal'
count = 1
why = "REVIEW-021 RF-001: the whole privacy property of ADR-015 rests on this one comparison. While it was only a descriptive 'uses a distinct Ed25519 key pair', a fully conformant node could reuse one key for both roles and hand every offline reader of the ledger its Peer ID. If this MUST NOT ever softens back into prose, the separation buys nothing and no other check would notice."

[[probe]]
id = "transport-attestation-validity-cap"
site = "identity.md"
pattern = '\*\*`max_transport_attestation_validity_ms`\*\*'
count = 1
why = "REVIEW-021 RF-002: the cap on the attestation window used to exist only as an example in parentheses, so an attestation with an arbitrarily distant expiry verified and the binding was permanent. It must stay a named signed parameter; an 'e.g.' reads as a rule and is not one."

[[probe]]
id = "transport-attestation-skew-tolerance"
site = "identity.md"
pattern = 'max_transport_attestation_future_skew_ms'
count = 3
why = "REVIEW-021 RF-003: without a declared future-skew tolerance a node whose clock is slightly slow rejects every fresh attestation, loses ledger-sync, and thereby loses the only source from which it could correct its clock. Every mention is pinned: the rejection rules, the bounded-validity reasoning, and the connection-authentication list."

[[probe]]
id = "admission-shield-source-is-address"
site = "identity.md"
pattern = 'means the observed remote address, normatively, and never the libp2p'
count = 1
why = "REVIEW-021 RF-004: ADR-015 made a fresh Peer ID cost one keygen. An admission limit anchored to the Peer ID is a limit the attacker resets for free, and before this sentence the document left the anchor to be inferred from an explanatory paragraph."

[[probe]]
id = "revocation-applies-to-live-connections"
site = "identity.md"
pattern = '\*\*Revocation applies to live connections, not only to new ones\.\*\*'
count = 1
why = "REVIEW-021 RF-006: verification is specified at connection setup, and ADR-015 moved the whole verification into the session. Without a re-evaluation rule a session opened one block before a revocation is finalized outlives it for as long as the peer keeps it open."
