# --- what `enrolled, unrevoked` means, and why the reading was chosen -------
#
# [SPEC-019] wrote the definition [DEBT-022] found missing. The whole section is
# prose: it carries no digest, no domain string, no tag byte, so the five
# discovery classes see nothing in it and only these probes hold it in place.
# Losing any of them would leave the four authorization rules qualified by a
# word with two readings again, which is where the fork was.

[[probe]]
id = "unrevoked-anchored-to-the-including-height"
site = "ledger.md"
pattern = 'no `revoke_identity` in that chain names `node_id` at a height at most `h` —\s+the block at `h` included'
count = 1
why = "The definition itself, clause 2. It anchors transaction-authorization revocation to inclusion height rather than to finalization or to effective_height [ADR-017]. Repointed by [REVIEW-042] RF-002: the wording it used to pin said 'no **finalized** revoke_identity ... included at a height at most h' while the preamble scoped both clauses to the state the block builds on, and read literally the two excluded the block at h itself — the exact singleton where the readings diverge, and the row the conformance suite calls invalid. The probe held the ambiguous form in place, so the gate was green on it."

[[probe]]
id = "unrevoked-clause-two-includes-the-block-at-h"
site = "ledger.md"
pattern = 'Neither clause says \*finalized\*, and the block at `h` is in scope'
count = 1
why = "[REVIEW-042] RF-002. The scope of the definition is the block being validated **and** its ancestors, and the word 'finalized' is deliberately absent from both clauses. Without this paragraph the correction reads as a rewording rather than as a decision, and the next editor restores 'finalized' as a tightening."

[[probe]]
id = "unrevoked-revocation-shares-the-fate-of-its-block"
site = "ledger.md"
pattern = 'share the fate of block\s+`h`'
count = 1
why = "[REVIEW-042] RF-002, the reason the scope above is sound rather than merely stipulated: a revocation in block h and a spend in block h stand or fall together, so the revocation's own finality is not a separate condition — and could not be one, since no block carries a quorum certificate."

[[probe]]
id = "unrevoked-predicate-ignores-intra-block-order"
site = "ledger.md"
pattern = '\*\*The predicate never consults intra-block execution order, and that is the\s+reason it is safe\.\*\*'
count = 1
why = "[REVIEW-042] RF-002, second face. The document used to give the class-0/class-1 execution order **as** the justification for biting at inclusion height. The predicate is evaluated at the granularity of a height and never reads the order, and that insensitivity is what makes it safe and what keeps [DEBT-035] out of it. An implementer following the old justification writes a predicate that reads revocations at execution time, whose verdict depends on a grindable created_at_ms."

[[probe]]
id = "unrevoked-execution-order-is-not-the-justification"
site = "ledger.md"
pattern = '\*\*Intra-block execution ordering is consistent with the rule and is not its\s+justification\.\*\*'
count = 1
why = "The other half of the same correction. Deleting the class ordering entirely would leave a reader checking the execution model to derive the agreement alone; leaving it unlabelled is how it was mistaken for the reason. This sentence is the label."

[[probe]]
id = "unrevoked-spending-path-bites-in-english"
site = "ledger.md"
pattern = 'on the \*\*spending path\*\*, revocation \*\*bites\*\* at the \*\*height of the block that includes it\*\*'
count = 1
why = "[REVIEW-042] RF-006. The sentence that states part 1 of [ADR-017] carried the Italian word 'morde' in English normative prose — the single occurrence counted over docs/, core/ and sim/, and published_artifacts.py was PASS on it. This probe pins the corrected sentence so the verb cannot drift back."

[[probe]]
id = "unrevoked-no-block-carries-a-quorum-certificate"
site = "ledger.md"
pattern = 'no block carries one'
count = 1
why = "The reason the finalized reading cannot be settled by replay, and the only reason that does not depend on convenience. Without it the choice reads as a preference between two workable options rather than as the elimination of one."

[[probe]]
id = "unrevoked-declared-window-cost"
site = "ledger.md"
pattern = '\*\*Why inclusion height on the spending path, and the separation of the two jobs of revocation\.\*\*'
count = 1
why = "The declared separation between the spending path (inclusion height, intra-block class 0 ordering before spends in class 1) and the validator set path (effective_height) [ADR-017]."

[[probe]]
id = "unrevoked-receiver-local-rule-is-not-the-definition"
site = "ledger.md"
pattern = 'One rule this definition does not govern'
count = 1
why = "identity.md's connection rule is worded in the second reading. It is a receiver-local acceptance rule and is legitimately anchored to the receiver's own view, but a reader who met it first would take it for the definition, which is exactly how the two readings came to coexist."

[[probe]]
id = "auth0-divergent-rows-are-the-fixture"
site = "ledger.md"
pattern = '\*\*Rows `20`, `21` and `49` are the divergent ones of this table\*\*'
count = 1
why = "Names which rows of AUTH-0 are the guard and which are arithmetic. A later editor tidying the table would otherwise delete the two rows the fixture exists for and keep the ones both readings already agreed on. Reworded by [REVIEW-033] RF-007: the sentence used to say those rows were the only divergent cases, which is true of the table and false of the heights. Row `20` was added by [REVIEW-039] RF-001, and it is the boundary of clause 2 as well as a divergent row."

[[probe]]
id = "revocation-grace-floor-is-a-genesis-bound"
site = "ledger.md"
pattern = '\*\*The floor under `revocation_effective_grace_blocks` is a genesis bound, and it\s+is a width rather than a number\.\*\*'
count = 1
why = "[REVIEW-042] RF-001, and the correction [ADR-017] took on 2026-08-27. The band is paid for at the price of `G`, which the decision described as discretion 'declared and bounded at genesis'; for one delivery only the ceiling was anchored and `G >= 1` sat among the relational constraints, so a sitting set could publish `G = 1` and reduce the emergency window to two blocks through ordinary governance. This paragraph is where the floor stops being an implementation detail."

[[probe]]
id = "revocation-grace-floor-is-one-rotation-of-the-minimum-set"
site = "ledger.md"
pattern = '\*\*the window lasts at least one full rotation of the\s+minimum set\*\*'
count = 1
why = "The reason the floor is a relation between genesis constants and not a value: no rule imposes a cadence, so `G + 1` blocks do not convert into real time and the floor cannot be justified in seconds. Deleting this sentence turns `revocation_effective_grace_blocks_min + 1 >= validator_min_set_size_min` into an unexplained inequality that the next tuning pass would relax."

[[probe]]
id = "revocation-band-ceiling-is-new-and-inverted"
site = "ledger.md"
pattern = '\*\*What this floor does not fix, stated rather than implied\.\*\*'
count = 1
why = "[REVIEW-042] RF-001, the half the correction does not close: the ceiling of the band is new to [SPEC-022] — the pre-existing clause 4 had a floor and no ceiling — so a delayed inclusion can now destroy a revocation instead of only postponing it, and `key_compromise` keeps the narrowest window despite carrying the highest urgency. That is [DEBT-040], and a floor described without it reads as a closure."

[[probe]]
id = "revocation-planned-delay-may-equal-floor-plus-grace"
site = "ledger.md"
pattern = '\*\*`max_planned_revocation_delay_blocks` may equal `F \+ G`, and at that value\s+`reason` is read but changes nothing\.\*\*'
count = 1
why = "[REVIEW-042] RF-008. `P >= F + G` is the constraint [ADR-017] decided, and `P = F + G` is therefore a lawful document under which the two rows of the band table coincide at every height: `reason` is parsed, committed in the transaction ID, and selects nothing. Nothing rejects that state and one document reaches it. Declared here rather than closed with a strict inequality, because the `>=` is the operator's decision."

[[probe]]
id = "revocation-delays-are-in-the-change-ratio"
site = "ledger.md"
pattern = '\*\*The rate of change governs thirteen parameters, and three of them are the\s+revocation delays\.\*\*'
count = 1
why = "[REVIEW-042] RF-003: the three revocation delays had two of the three layers [ADR-010] requires. Without the ratio, `min_revocation_effective_delay_blocks` could travel from its floor to its genesis ceiling in one document, and raising it authorizes a longer `max_weak_subjectivity_age_ms` — the very coupling [ADR-017] claims to have broken with the genesis bound."

[[probe]]
id = "revocation-band-parameters-come-from-the-including-header"
site = "ledger.md"
pattern = '\*\*which document those are is a fact of the including block\*\*'
count = 1
why = "[REVIEW-042] RF-004: clause 3 of [ADR-017] was documented and not implemented, and the test carrying its name called the checker twice at the same height, proving only that the function reads its own argument. `BlockHeader` carries `consensus_parameters_hash`, so the selector exists; this sentence is where the document names it, and it is what a second implementation reads to know which pair to pass."

[[probe]]
id = "unrevoked-effective-height-reason-band"
site = "ledger.md"
pattern = 'the reason-dependent band \(\[ADR-017\]\):'
count = 1
why = "[ADR-017] replaced the uncapped effective_height with reason-dependent bands capping key_compromise by p + F + G and validator_misconduct/operator_request by p + P."

[[probe]]
id = "unrevoked-window-is-the-sample-not-the-enumeration"
site = "ledger.md"
pattern = 'The heights on which the two readings disagree are\s+the whole interval'
count = 1
why = "[REVIEW-033] RF-007 / [ADR-017]: AUTH-0 samples the divergence between the inclusion-height and effective-height readings; the divergence itself runs over the whole interval 20..49. This sentence is the one that keeps the count attached to its perimeter, and deleting it turns a sample back into an apparent enumeration."

[[probe]]
id = "unrevoked-clause-one-boundary-row"
site = "ledger.md"
pattern = 'Row `5` is `h = valid_from_height`'
count = 1
