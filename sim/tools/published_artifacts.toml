# --- equalities an inline example must satisfy -----------------------------

[[example_invariant]]
id = "challenge-evidence-request-hash"
site = "ledger.md"
selector = "\"kind\":\"challenge_evidence\""
equal_fields = ["body.challenge_id", "body.request_hash"]
rule = "README.md#hash-preimage-registry: `challenge_id` MUST equal `request_hash`"

# --- hand-pinned normative passages ----------------------------------------

[[probe]]
id = "block-interval-genesis-constant"
site = "README.md"
pattern = "\\| `block_interval_seconds` \\| `5` \\| no — genesis only \\(\\[ADR-013\\]\\) \\|"
count = 1
why = "The genesis constant of [ADR-013] must stay in the documents as a constant and not as a governed parameter."

[[probe]]
id = "block-interval-not-enforced"
site = "README.md"
pattern = "\\*\\*`block_interval_seconds = 5` is declared, not enforced\\.\\*\\*"
count = 1
why = "[ADR-013] part 3 is a renunciation, and a declared cadence reads as an enforced one unless the difference is written."

[[probe]]
id = "block-interval-no-rule-can-impose-it"
site = "README.md"
pattern = '\*\*No rule of this protocol prevents that, and none can\.\*\*'
count = 1
why = "Replaces the probe that pinned the [DEBT-013] link, which SPEC-016 closes. What must stay pinned is the renunciation itself: a reader who finds the cadence measured and does not find this sentence will read the measurement as enforcement."

[[probe]]
id = "cadence-band-object"
site = "README.md"
pattern = '"min_measured_blocks":u64-string'
count = 1
why = "The cadence band is a genesis trust anchor alongside ElectionBounds and RewardBounds, and its noise floor is part of the object: a network that ships no CadenceBand is not conformant."

# --- the genesis cadence band, its five values and what they cost -----------
#
# [SPEC-021] wrote the values [ADR-016] decided. A value written without its
# cost is the defect that spec exists to prevent: a reader who finds a band and
# not its cost concludes the cadence is limited, when it is only measurable.
# Each value is pinned separately from the sentence stating its cost, because
# the two can be deleted independently and the loss is different.

[[probe]]
id = "genesis-band-declared-interval-row"
site = "README.md"
pattern = '\| `block_interval_ms` \| `5000` \|'
count = 1
why = "The band's own copy of the genesis constant. Without it the table's other four rows are multiples of nothing."

[[probe]]
id = "genesis-band-fast-side-row"
site = "README.md"
pattern = '\| `min_ms_per_block` \| `2500` \| `block_interval_ms / 2` \|'
count = 1
why = "The fast side [ADR-016] decided, with the multiple it is. This is the side a light client fails closed on, so a wrong or missing value here is an availability decision nobody took."

[[probe]]
id = "genesis-band-slow-side-row"
site = "README.md"
pattern = '\| `max_ms_per_block` \| `20000` \| `4 \* block_interval_ms` \|'
count = 1
why = "The slow side, and the multiple is part of the value: 20 000 ms means nothing to a reader who cannot see that it is four intervals."

[[probe]]
id = "genesis-band-noise-floor-row"
site = "README.md"
pattern = '\| `min_measured_blocks` \| `720` \|'
count = 1
why = "The floor under the numerator. A band that lost it would pronounce on a handful of blocks, which is the degenerate anchor CadenceBand::validate refuses."

[[probe]]
id = "genesis-band-slack-row"
site = "README.md"
pattern = '\| `max_external_clock_slack_ms` \| `600000` \|'
count = 1
why = "The floor under the denominator, [REVIEW-027] RF-001. It is also the value whose relational rule against the measured window can be broken by editing either operand."

[[probe]]
id = "genesis-band-slow-side-costs-four"
site = "README.md"
pattern = '\*\*The slow side, `4 \* block_interval_ms`, costs four\.\*\*'
count = 1
why = "The cost of the slow side as a number. 'A set can stretch its epochs' is true and says nothing; four says how much, and it is the figure a reader compares against their own expectation of an epoch in days."

[[probe]]
id = "genesis-band-slow-side-stretches-epochs-fourfold"
site = "README.md"
pattern = 'can stretch its own epochs to \*\*four times\*\* their declared real-time length'
count = 1
why = "The consequence the number carries, stated where the number is. Pinned apart from the heading sentence because a rewrite that keeps the multiple and drops the consequence leaves the arithmetic and removes the warning."

[[probe]]
id = "genesis-band-fast-side-objects-at-a-doubling"
site = "README.md"
pattern = '\*\*The fast side, `block_interval_ms / 2`, objects at a doubling\.\*\*'
count = 1
why = "The cost of the fast side as a rate. The two sides do not trade against the same thing, and a document that states one cost and not the other invites the symmetric reading [ADR-016] rejected."

[[probe]]
id = "genesis-band-is-not-a-limit-on-the-cadence"
site = "README.md"
pattern = '\*\*These five numbers do not limit the cadence'
count = 1
why = "The renunciation of [ADR-013] restated where the values are, because that is where it is likeliest to be forgotten. The probe pinning 'No rule of this protocol prevents that, and none can' is 1 200 lines away, and a reader arriving at the band from the trust-anchor section never passes it."

[[probe]]
id = "genesis-band-slack-is-a-choice-not-a-measurement"
site = "README.md"
pattern = 'this deployment expects, and not a measurement of one\.\*\*'
count = 1
why = "[ADR-016] declares 600 000 ms a judgement about expected release latency rather than a measured fact, and says it must be re-examined once a release process exists. Written without that qualification the number becomes a datum nobody remembers choosing."

[[probe]]
id = "cadence-timestamp-is-not-an-input-readme"
site = "README.md"
pattern = '`timestamp_ms` is not an input to either measurement, and MUST NOT become one\.'
count = 1
why = "[ADR-013] rejects a validity rule on the distance between consecutive timestamp_ms values. The measurement that replaces it must say that it does not reach for the same quantity by another door, because that is the remedy that looks obvious."

[[probe]]
id = "cadence-timestamp-is-not-an-input-ledger"
site = "ledger.md"
pattern = '`timestamp_ms` is \*\*not\*\* an input to this step and MUST NOT be used in it'
count = 1
why = "The same prohibition where an implementer of the light client reads, which is not where the trust anchors are described."

[[probe]]
id = "cadence-light-client-step"
site = "ledger.md"
pattern = '4b\. \*\*Measure the real cadence\.\*\*'
count = 1
why = "The measurement is a step of the light-client algorithm and not an optional diagnostic. Numbered 4b so the existing references to steps 1, 5 and 6 keep their targets."

[[probe]]
id = "reward-epoch-settlement-floor"
site = "ledger.md"
pattern = 'height `h` satisfying `\(e \+ 1\) \* reward_epoch_blocks <= h`'
count = 1
why = "The derivation [DEBT-019] asked for. Without it reward_epoch_ms_min bounds a number in a signed document and not the speed at which the index advances."

[[probe]]
id = "reward-epoch-bound-is-per-block"
site = "ledger.md"
pattern = 'That is a bound \*\*per block\*\*\. It is \*\*not\*\* a bound per unit of real'
count = 1
why = "Family 3 of recurring-defects.md: the rule constrains blocks per index, while the property depends also on real milliseconds per block. The document must not claim the larger of the two."

[[probe]]
id = "validator-set-hash-exception-declared"
site = "ledger.md"
pattern = '\*\*This preimage carries no `chain_id`'
count = 1
why = "[DEBT-014]: the exception is deliberate and must be declared beside the formula, because an undeclared exception reads as an oversight and the reader who closes it pays for a migration that buys nothing."


[[probe]]
id = "block-interval-in-ledger"
site = "ledger.md"
pattern = "\\*\\*The target block interval is 5 seconds, and v0 does not enforce it\\.\\*\\*"
count = 1
why = "The block-format section is where an implementer looks for the timestamp rules and must find the non-imposition there."

[[probe]]
id = "lifecycle-encoding-table"
site = "ledger.md"
pattern = "\\| `suspended` \\| `0x03` \\|"
count = 1
why = "The lifecycle_u8 encoding is normative because it enters a preimage; DEBT-012 exists because it was missing."

[[probe]]
id = "lifecycle-zero-reserved"
site = "ledger.md"
pattern = "\\*\\*Every other value, `0x00` included, is invalid\\.\\*\\*"
count = 1
why = "An unknown lifecycle value must be rejected and never defaulted; a default is how the divergence returns."

[[probe]]
id = "argon2id-band-declared"
site = "README.md"
pattern = "`iterations = 1` with `196608 <= memory_kib < 2097152`"
count = 1
why = "RF-109: the admitted band must stay named, because the sentence that omitted it claimed more than the rules impose."

[[probe]]
id = "argon2id-superlative-retracted"
site = "README.md"
pattern = "That is \\*\\*not\\*\\* the same as \\\"everything weaker than either recommendation is"
count = 1
why = "RF-109: the retraction must stay. A retraction that is deleted is a rehabilitation, and .lmbrain/knowledge/recurring-defects.md records what a rehabilitation cost this project."

[[probe]]
id = "admission-nonce-volume-rule"
site = "identity.md"
pattern = "\\*\\*issuance is counted against the step-1 per-source rate limit\\*\\*"
count = 1
why = "RF-110: without counting issuance, Part 1 of the admission shield costs an attacker a round trip and not an address."

[[probe]]
id = "admission-nonce-cap-declared"
site = "identity.md"
pattern = "every `k` concurrent slots"
count = 1
why = "RF-110: the consequence must be stated in terms of the declared cap, not as one address per slot."

[[probe]]
id = "inline-examples-not-oracles"
site = "README.md"
pattern = "\\*\\*The fixture table above is the only oracle in these documents\\.\\*\\*"
count = 1
why = "Sixteen of the thirty-seven published digests are placeholders; without this statement a reader cannot tell which."

[[probe]]
id = "ed25519-rule1-clause-a"
site = "README.md"
pattern = "a `y` whose masked value is `>= 2\\^255-19` is \\*\\*not\\*\\* rejected"
count = 1
why = "REVIEW-019 RF-002: rule 1 named one decoding departure from RFC 8032 and left the other implicit. Half a normative rule is the shape of defect ADR-012 exists for, and this half is the one no upstream vector exercises."

[[probe]]
id = "ed25519-rule1-clause-b"
site = "README.md"
pattern = "`x = 0` with the sign bit set to 1 is \\*\\*not\\*\\* rejected"
count = 1
why = "REVIEW-019 RF-002: this is the clause upstream vectors 8-11 actually exercise, and the one the rule used to be silent about while its prose mislabelled it as a non-canonical y."

[[probe]]
id = "ed25519-extension-table-required"
site = "README.md"
pattern = "MUST pass \\*\\*both\\*\\* tables before it can participate in a Coblox network"
count = 1
why = "REVIEW-019 RF-001: an implementation that passes only the upstream twelve has demonstrated nothing about clause 1a, so conformance has to name both tables or the second one is decoration."

[[probe]]
id = "transport-key-distinct-from-identity"
site = "identity.md"
pattern = 'the transport public key MUST NOT equal'
count = 1
why = "REVIEW-021 RF-001: the whole privacy property of ADR-015 rests on this one comparison. While it was only a descriptive 'uses a distinct Ed25519 key pair', a fully conformant node could reuse one key for both roles and hand every offline reader of the ledger its Peer ID. If this MUST NOT ever softens back into prose, the separation buys nothing and no other check would notice."

[[probe]]
id = "transport-attestation-validity-cap"
site = "identity.md"
pattern = '\*\*`max_transport_attestation_validity_ms`\*\*'
count = 1
why = "REVIEW-021 RF-002: the cap on the attestation window used to exist only as an example in parentheses, so an attestation with an arbitrarily distant expiry verified and the binding was permanent. It must stay a named signed parameter; an 'e.g.' reads as a rule and is not one."

[[probe]]
id = "transport-attestation-skew-tolerance"
site = "identity.md"
pattern = 'max_transport_attestation_future_skew_ms'
count = 8
why = "REVIEW-021 RF-003: without a declared future-skew tolerance a node whose clock is slightly slow rejects every fresh attestation, loses ledger-sync, and thereby loses the only source from which it could correct its clock. Every mention is pinned: the rejection rules, the bounded-validity reasoning, and the connection-authentication list. Raised from 3 to 7 by SPEC-020, which added four: the accepted-window inequality, the width formula, the named sum with max_transport_attestation_validity_ms, and the three-term exposure block. The four are the reason DEBT-017 existed — the parameter is only half of a sum, and a document that named it three times never wrote the sum down — so pinning them is pinning the remedy and not incidental prose. Raised again from 7 to 8 by the REVIEW RF-002 remediation, which split rejection rule 5 into its two halves: the admission half now names the parameter beside `local_clock_ms` rather than beside a floored clock, and that is the mention that must not be lost — routing this half through the floored value is the defect the split exists to prevent."

[[probe]]
id = "transport-attestation-clock-floor"
site = "identity.md"
pattern = 'now_ms = max\(local clock, checkpoint\.issued_at_ms\)'
count = 1
why = "SPEC-020, closing DEBT-017. The exposure of an attestation is validity + skew + how far the receiver's clock is behind, and only the third term was ever unbounded. This line is the floor that reduces it — to the age of the checkpoint held, which no rule bounds — and it is pinned on the exact source: issued_at_ms of the weak subjectivity checkpoint, which no validator writes. The rewrite that would silently undo the reduction is not deleting the line but changing that field to timestamp_ms — one line away in the same schema, written by the validator set, and since a peer without a valid attestation is disconnected rather than ignored it would hand that set a partition lever. The pattern therefore pins the field name and not merely the presence of a floor."

[[probe]]
id = "transport-attestation-admission-half-is-unfloored"
site = "identity.md"
pattern = 'created_at_ms > local_clock_ms \+ max_transport_attestation_future_skew_ms'
count = 2
why = "REVIEW RF-002. A floor under now_ms is not fail-closed: it is fail-closed on the expiry half of rejection rule 5 and fail-open on the admission half. Routed through the floored value, an anchor ahead of real time by D lets a receiver whose own clock is exact accept an attestation postdated past the signed tolerance, and the real acceptance window becomes max_transport_attestation_validity_ms + D with D chosen by whoever signs the checkpoint. That is a capability of admission on the transport, and the release key's existing capabilities are all of denial or of anchoring, which do not subsume it. This line is the split, and it is pinned on `local_clock_ms` because the rewrite that undoes it is not deleting the rule but changing which clock this half reads. Two occurrences and both are load-bearing: the rejection rule itself, and the restatement inside point 5 that says an implementation evaluating this half against the floored value does not implement the rule."

[[probe]]
id = "transport-attestation-floor-not-gated-on-step-1"
site = "identity.md"
pattern = 'The floor does not require a fresh checkpoint'
count = 1
why = "REVIEW RF-001. Step 1 of light-client balance verification evaluates checkpoint freshness on the receiver's bare local clock and fails when issued_at_ms exceeds it; the floor raises now_ms only when issued_at_ms exceeds it. The two conditions are each other's negation, so a reader who assumes the floor consumes only step-1-accepted checkpoints concludes the remedy is inert, and an implementer who codes that assumption makes it inert. The separation is sound because freshness is a precondition for anchoring chain state and not for bounding real time from below - an old checkpoint is a weaker floor, never an unsafe one - but it is exactly the kind of soundness that survives only while it is written down. Pinned because its absence is invisible: nothing fails, the floor simply never fires."

[[probe]]
id = "transport-attestation-residual-is-declared"
site = "identity.md"
pattern = 'with a checkpoint; UNBOUNDED without one'
count = 1
why = "SPEC-020. A reader who sees a sum concludes the sum is the total. The receiver holding no checkpoint — the freshly installed node reason 1 of this section exists to protect — applies no floor at all, so for it the third term stays unbounded exactly as before. This is the residue, written beside the sum rather than after it, and it is pinned because dropping it is how a bounded-looking sum outruns the rule that produced it. The floor reduces this term and does not close it: with a checkpoint the residue is the checkpoint's own age, which no rule of this protocol bounds either."

[[probe]]
id = "admission-shield-source-is-address"
site = "identity.md"
pattern = 'means the observed remote address, normatively, and never the libp2p'
count = 1
why = "REVIEW-021 RF-004: ADR-015 made a fresh Peer ID cost one keygen. An admission limit anchored to the Peer ID is a limit the attacker resets for free, and before this sentence the document left the anchor to be inferred from an explanatory paragraph."

[[probe]]
id = "revocation-applies-to-live-connections"
site = "identity.md"
pattern = '\*\*Revocation applies to live connections, not only to new ones\.\*\*'
count = 1
why = "REVIEW-021 RF-006: verification is specified at connection setup, and ADR-015 moved the whole verification into the session. Without a re-evaluation rule a session opened one block before a revocation is finalized outlives it for as long as the peer keeps it open."

# --- passages the public guide depends on -----------------------------------
#
# Added by [SPEC-015]. Each probe pins the rule that holds one property claim of
# .lmbrain/design/coblox-public-guide/index.html, so that changing the rule turns
# CI red ON THE GUIDE instead of on a reminder to reread it. The `claims` field
# carries the guide's own sentence and is checked in the other direction by
# .lmbrain/design/coblox-public-guide/tools/check-guide-pairs.mjs, which fails if
# a probe here no longer corresponds to anything the page says.
#
# `claims` is not read by this tool. It is data for the guide's own checker, and
# it lives here rather than beside the page so that the sentence and the rule it
# rests on are one record and cannot drift into two.

[[probe]]
id = "guide-sybil-not-cryptographic"
site = "identity.md"
pattern = "while not being Sybil-resistant by cryptographic means"
count = 1
claims = ["It can prove that a balance was not invented, that a signature is genuine, that nothing was spent twice."]
why = "The guide's first uncomfortable sentence says the network is good at stopping forgery and not at stopping crowds. This is the passage that says both halves and requires them to be said together; if it softens, the guide is claiming a resistance the protocol does not have."

[[probe]]
id = "guide-emulated-nodes-indistinguishable"
site = "identity.md"
pattern = "does not distinguish `N` emulated nodes on one host from `N`"
count = 1
claims = ["It cannot tell a thousand devices apart from one computer pretending to be a thousand devices."]
why = "The plain-language form of the same limit. A reader cannot verify it, so the sentence has to keep pointing at the rule that concedes it."

[[probe]]
id = "guide-sybil-gap-is-permanent"
site = "identity.md"
pattern = "MUST NOT be described as a temporary gap"
count = 1
claims = ["That is a deliberate and permanent property of this version, not a gap waiting for a patch."]
why = "The guide says 'permanent', not 'not yet'. That word is the whole difference between a declared limit and a promise, and this is the rule that forbids the softer reading."

[[probe]]
id = "guide-availability-proves-a-key-not-a-device"
site = "identity.md"
pattern = "proves that \\*a key is online\\*, not that \\*a device exists\\*"
count = 1
claims = ["Answering \"are you there?\" proves that a key is online, not that a device exists."]
why = "The guide repeats this distinction almost verbatim because it is the mechanism behind the crowd limit rather than a restatement of it."

[[probe]]
id = "guide-enrolment-is-memory-hard"
site = "identity.md"
pattern = "The primitive is \\*\\*Argon2id\\*\\*"
count = 1
claims = ["Joining costs a one-time proof of work: your device has to do a deliberately expensive memory-heavy calculation before it is enrolled."]
why = "'Memory-heavy' is the load-bearing adjective: with a compute-bound primitive the same sentence would be false on a phone. If the primitive changes, the guide's description of what joining costs stops being true."

[[probe]]
id = "guide-one-time-cost-cannot-price-a-flow"
site = "identity.md"
pattern = "\\*\\*A one-time cost cannot price a perpetual flow\\.\\*\\*"
count = 1
claims = ["A one-time cost cannot price something that pays out for ever."]
why = "The guide declines to present the joining cost as the Sybil answer. This is the declared limit it is deferring to."

[[probe]]
id = "guide-existence-income-is-a-shared-pot"
site = "ledger.md"
pattern = "Existence income is \\*\\*not\\*\\* a fixed amount per node"
count = 1
claims = ["the reward for merely existing is a fixed pot shared out among everyone who qualifies, not an amount per device"]
why = "This is the arithmetic that turns the Sybil position from an intention into a rule, and the guide leans on it twice: to say what containment there is, and to say why your own income falls when more devices qualify."

[[probe]]
id = "guide-existence-fund-capped-by-construction"
site = "ledger.md"
pattern = "emission for an epoch is therefore at most `F` by construction, not by"
count = 1
claims = ["The remainder is not minted at all, so the period's presence emission is capped by construction rather than by anyone's restraint."]
why = "The guide says 'by construction rather than by anyone's restraint'. Without this sentence the cap would be a convention, and the guide would be promising a governance habit as though it were a rule."

[[probe]]
id = "guide-remainder-is-not-minted"
site = "ledger.md"
pattern = "The remainder is \\*\\*not\\*\\* minted and is not carried forward"
count = 1
claims = ["that total divided by their number, rounded down"]
why = "Rounding down only caps the fund because the remainder is destroyed rather than carried. The guide states the division in one line and would be wrong about the cap if this changed."

[[probe]]
id = "guide-fleet-dilutes-rather-than-mints"
site = "ledger.md"
pattern = "fleet can only dilute the share of honest nodes"
count = 1
claims = ["Ten fake devices do not create more credits; they only take smaller shares of the same pot"]
why = "The guide gives the reader the consequence in the reader's own terms. This is the sentence in the rules that says the attack degrades to redistribution instead of forgery."

[[probe]]
id = "guide-eligible-count-is-falsifiable"
site = "ledger.md"
pattern = "the root makes the count \\*\\*falsifiable\\*\\*"
count = 1
claims = ["an inflated count can be contradicted by recomputation instead of merely disputed"]
why = "The guide is careful to say 'contradicted', not 'prevented'. The rule supports exactly the weaker verb."

[[probe]]
id = "guide-challenge-kinds"
site = "ledger.md"
pattern = "\"kind\":\"availability\"\\|\"storage\"\\|\"compute\""
count = 1
claims = ["prove it still holds a piece of data it agreed to keep, or to run a small computation and hand back the result"]
why = "The three kinds of question the guide describes are an enumeration in the evidence schema. A fourth kind, or one removed, makes the guide's description of what your device is asked incomplete."

[[probe]]
id = "guide-challenge-outcomes-include-late"
site = "ledger.md"
pattern = "\"outcome\":\"passed\"\\|\"failed\"\\|\"late\"\\|\"no_response\""
count = 1
claims = ["An answer that does not arrive in time counts as an answer that did not arrive."]
why = "'late' and 'no_response' are distinct recorded outcomes. The guide tells a reader that a missed deadline is not forgiven, which is only true while those outcomes exist and are not treated as passes."

[[probe]]
id = "guide-secret-fixed-before-randomness"
site = "ledger.md"
pattern = "was fixed before the beacon existed"
count = 1
claims = ["the asker has to lock in its secret before the randomness that picks the question exists, so it cannot go looking for a device it already knows will fail"]
why = "This is the ordering the whole unpredictability claim rests on, and it is checkable rather than asserted. If the commitment stops having to precede the beacon, the guide's promise that nobody steers the question is empty."

[[probe]]
id = "guide-every-verifier-recomputes"
site = "ledger.md"
pattern = "not only validators — MUST recompute"
count = 1
claims = ["reader — not only validators — recomputes all of it"]
why = "The guide tells the reader that they are not asked to trust the validators on this. The rule has to keep saying 'every verifier' rather than 'validators'."

[[probe]]
id = "guide-bad-evidence-pays-nobody"
site = "ledger.md"
pattern = "Evidence failing any of these is invalid and cannot back a mint\\."
count = 1
claims = ["evidence that fails any step cannot pay anybody"]
why = "The guide's answer to 'what happens if somebody cheats' is mostly this sentence: the cheating does not count. It is the rule that makes that answer true rather than hopeful."

[[probe]]
id = "guide-grinding-degrades-to-one-of-two"
site = "ledger.md"
pattern = "to \"pass one of two\""
count = 2
claims = ["the attack is reduced from \"pass the question\" to \"pass one of two\""]
