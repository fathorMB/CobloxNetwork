pattern = 'ceiling twice\*\*\. Against that it adds a second spelling of'
count = 1
why = "The alternative placeholder is the obvious improvement, so the reason it was declined has to stay next to the rule or it will be adopted by someone who did not know it had been considered. The reason is now stated against the true perimeter -- every genesis payload already carries the network name in its own bytes -- instead of against the narrower one it was first written against. [REVIEW-029] RF-003."

[[probe]]
id = "gen0-key-binding-clause-has-no-fixture"
site = "README.md"
pattern = '\*\*The consequence is that no published value exercises the `key_binding_signature`'
count = 1
why = "Family 4 of recurring-defects.md: a normative clause no oracle exercises. GEN-0 covers the header and the document clauses and not this one, and the gap is declared rather than left for a reader to discover from a green suite."

[[probe]]
id = "genesis-previous-block-id-not-configurable"
site = "ledger.md"
pattern = 'fixed by this sentence and is not configurable: it is an input to'
count = 1
why = "previous_block_id of the height-0 header is an input to genesis_block_id and therefore to chain_id. The earlier wording, 'the configured all-zero previous ID', admitted a reading in which a distribution could choose it, which would leave chain_id underdetermined by another door."

# --- markdown outside the sweep, each with its reason ------------------------
#
# [REVIEW-027] RF-005: every markdown a reader can reach is classified in one of
# meta.documents, meta.claim_documents or this list, and check_document_closure
# fails on anything in none of them. The bucket is named `unswept` and not
# `unpublished` because some of its members are published — what is true of all
# of them is that the sweep deliberately does not read them.

[[unswept]]
path = "AGENTS.md"
why = "Operating instructions addressed to agents working in this repository, not to readers of the protocol or of the product. It carries no normative rule and no security claim, and its content is governed by .lmbrain/AGENT.md rather than by this inventory."

[[unswept]]
path = "README.md"
why = "The repository front page. It is published — GitHub serves it to every visitor — but it carries build instructions and an orientation paragraph, no normative rule and no security claim, and its basename collides with the protocol README's probe key so it cannot be swept as a claim document until one of the two is renamed. The classification is not a permission: check_document_closure scans every `unswept` document for security-claim vocabulary and fails if one appears here, which is the day it has to become a claim document."

# --- files that legitimately carry published values --------------------------

[[transcription_exempt]]
path = "sim/tools/published_artifacts_negative.py"
why = "The negative proof of this tool. It reintroduces defects by editing published values, so it must carry them literally; recording it as a mirror would make C5 assert that the inventory's own test fixture is a copy of the documents, which is the opposite of what it is."
